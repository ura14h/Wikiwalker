%, 25.52% 13.82%, 15.59% 20.11%, 7.72% 27.03%, 2.03% 34.42%, 0.05% 42.13%, 0.05% 50%, 0.05% 57.87%, 2.03% 65.58%, 7.72% 72.97%, 15.59% 79.89%, 25.52% 86.18%, 37.38% 91.68%, 51% 96.24%, 66.16% 99.68%, 68.54% 99.95%, 0.05% 99.95%, 0.05% 0.05%);shape-margin:2px;pointer-events:none;"></div><div data-shape-inside="1" contenteditable="false" style="float:right;width:39px;height:76px;shape-outside:polygon(31.46% 0.05%, 33.84% 0.32%, 49% 3.76%, 62.62% 8.32%, 74.48% 13.82%, 84.41% 20.11%, 92.28% 27.03%, 97.97% 34.42%, 99.95% 42.13%, 99.95% 50%, 99.95% 57.87%, 97.97% 65.58%, 92.28% 72.97%, 84.41% 79.89%, 74.48% 86.18%, 62.62% 91.68%, 49% 96.24%, 33.84% 99.68%, 31.46% 99.95%, 99.95% 99.95%, 99.95% 0.05%);shape-margin:2px;pointer-events:none;"></div><div data-shape-inside="1" contenteditable="false" style="height:31px;pointer-events:none;"></div>織田信長</div></div></div></div></foreignObject><text x="560" y="430" fill="#000000" font-family="Helvetica" font-size="12px" text-anchor="middle" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><tspan x="560" y="430"></tspan><tspan x="560" y="444"></tspan><tspan x="560" y="458">織田信長</tspan></text></switch></g></g></g><g data-cell-id="1ElzjOOWfw_mLMk7VUbI-0"><g transform="translate(0.5,0.5)"><path d="M 300 580 L 370 580 L 540 460" fill="none" stroke="#666666" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="all" style="stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/><g fill="#666666" font-family="Arial, Helvetica" text-anchor="middle" font-size="17px" style="fill: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-end; justify-content: unsafe flex-start; width: 1px; height: 1px; padding-top: 577px; margin-left: 302px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #666666; "><div style="display: inline-block; font-size: 12px; font-family: Helvetica; color: light-dark(#666666, #959595); line-height: 1.2; pointer-events: all; font-weight: bold; white-space: nowrap; ">選択記事ノード</div></div></div></foreignObject><text x="302" y="577" fill="#666666" font-family="Helvetica" font-size="12px" font-weight="bold" style="fill: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));">選択記事ノード</text></switch></g></g></g><g data-cell-id="T8RjdR2BUuAlPQMZvPCU-0"><g transform="translate(0.5,0.5)" style="filter: drop-shadow(light-dark(rgba(0, 0, 0, 0.25), rgba(237, 237, 237, 0.25)) 2px 3px 2px);"><rect x="740" y="380" width="120" height="240" rx="7.2" ry="7.2" fill="#ffffff" stroke="#000000" pointer-events="all" style="fill: var(--ge-adaptive-bg, #ffffff); stroke: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 114px; height: 1px; padding-top: 500px; margin-left: 744px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #000000; "><div style="display: inline-block; font-size: 12px; font-family: Helvetica; color: light-dark(#000000, #ffffff); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; "><div style=""><span style="font-size: 10px;">織田 信長（おだ のぶなが）は、日本の戦国時代から安土桃山時代にかけての武将・大名。戦国の三英傑の一人。</span></div><div><span style="font-size: 10px;">尾張国（現在の愛知県）出身。織田信秀の嫡男。家督争いの混乱を収めた後、桶狭間の戦いで今川義元を討ち取り、勢力を拡大した。足利義昭を奉じて上洛し、後には足利義昭を追放することで、畿内を中心に室町幕府に代わる独自の中央政権</span></div><div><span style="font-size: 10px;">...</span></div></div></div></div></foreignObject><text x="744" y="371" fill="#000000" font-family="Helvetica" font-size="12px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><tspan x="744" y="371">織田 信長（おだ</tspan><tspan x="744" y="385">のぶなが）は、日本</tspan><tspan x="744" y="399">の戦国時代から安土</tspan><tspan x="744" y="413">桃山時代にかけての</tspan><tspan x="744" y="427">武将・大名。戦国の</tspan><tspan x="744" y="441">三英傑の一人。</tspan><tspan x="744" y="455">尾張国（現在の愛知</tspan><tspan x="744" y="469">県）出身。織田信秀</tspan><tspan x="744" y="483">の嫡男。家督争いの</tspan><tspan x="744" y="497">混乱を収めた後、桶</tspan><tspan x="744" y="511">狭間の戦いで今川義</tspan><tspan x="744" y="525">元を討ち取り、勢力</tspan><tspan x="744" y="539">を拡大した。足利義</tspan><tspan x="744" y="553">昭を奉じて上洛し、</tspan><tspan x="744" y="567">後には足利義昭を追</tspan><tspan x="744" y="581">放することで、畿内</tspan><tspan x="744" y="595">を中心に室町幕府に</tspan><tspan x="744" y="609">代わる独自の中央政</tspan><tspan x="744" y="623">権</tspan><tspan x="744" y="637">...</tspan></text></switch></g></g></g><g data-cell-id="T8RjdR2BUuAlPQMZvPCU-1"><g transform="translate(0.5,0.5)"><path d="M 1040 730 L 970 730 L 800 610" fill="none" stroke="#666666" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="all" style="stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/><g fill="#666666" font-family="Arial, Helvetica" text-anchor="middle" font-size="17px" style="fill: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-end; justify-content: unsafe flex-end; width: 1px; height: 1px; padding-top: 727px; margin-left: 1038px;"><div style="box-sizing: border-box; font-size: 0; text-align: right; color: #666666; "><div style="display: inline-block; font-size: 12px; font-family: Helvetica; color: light-dark(#666666, #959595); line-height: 1.2; pointer-events: all; font-weight: bold; white-space: nowrap; ">選択記事詳細表